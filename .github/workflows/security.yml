name: Security and review verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet run --project tests/NetworkPortAnalyzer.Tests --no-build
      - run: node --check src/NetworkPortAnalyzer.Web/wwwroot/app.js
      - run: node tests/ui/inventory-contract.cjs
      - run: node scripts/review-artifacts.cjs --check
      - run: git diff --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          python3 -c "import hashlib; assert hashlib.sha256(open('/tmp/gitleaks.tar.gz','rb').read()).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml
